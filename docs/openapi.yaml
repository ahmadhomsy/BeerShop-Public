openapi: 3.0.3
info:
  title: Beershop Modular REST API
  description: Modular, secure REST API with JWT Authentication, Role-based Access Control, and Rate Limiting.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Docker Nginx Local Server
  - url: http://localhost:8000/api/v1
    description: Artisan Serve Local Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        errors:
          nullable: true

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Users & Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "john@example.com"
                password:
                  type: string
                  example: "secret123"
                role:
                  type: string
                  enum: [user, seller, admin]
                  example: "user"
      responses:
        '201':
          description: User registered successfully with JWT
        '422':
          description: Validation error

  /auth/login:
    post:
      summary: Login and obtain JWT token
      tags: [Users & Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "aa@gmail.com"
                password:
                  type: string
                  example: "0000"
      responses:
        '200':
          description: JWT token generated
        '401':
          description: Invalid credentials
        '429':
          description: Rate limit exceeded (Max 5 attempts / minute)

  /auth/me:
    get:
      summary: Get current authenticated user profile
      tags: [Users & Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
        '401':
          description: Unauthenticated

  /auth/logout:
    post:
      summary: Invalidate current JWT token
      tags: [Users & Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /products:
    get:
      summary: List products with pagination and category filtering
      tags: [Products]
      parameters:
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter by primary category ID
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list

    post:
      summary: Add a new product with image (Admin or Seller only)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price, category_id, image]
              properties:
                name:
                  type: string
                namear:
                  type: string
                price:
                  type: number
                quantity:
                  type: integer
                category_id:
                  type: integer
                second_category_id:
                  type: integer
                description:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Product created
        '403':
          description: Forbidden - Requires admin or seller role

  /products/{id}:
    get:
      summary: Get product details
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found

  /orders:
    get:
      summary: List orders (Customer sees their own; Admin sees all)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of orders

    post:
      summary: Place a new order
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, address, phone, items]
              properties:
                name:
                  type: string
                email:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
      responses:
        '201':
          description: Order placed successfully

  /orders/{id}:
    get:
      summary: Get order details (Customer can ONLY view their own order)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
        '403':
          description: Forbidden - Customer cannot view another customer's order
        '404':
          description: Order not found

  /orders/{id}/status:
    patch:
      summary: Change order status (ADMIN ONLY)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [0, 1, 2, 3, pending, processing, completed, cancelled]
      responses:
        '200':
          description: Order status updated
        '403':
          description: Forbidden - Non-admin user cannot change order status

  /notifications:
    get:
      summary: Get user notifications
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications list

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read
