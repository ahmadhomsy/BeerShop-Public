openapi: 3.0.3
info:
  title: BeerShop Modular REST API
  description: |
    Production-grade Modular REST API with JWT Authentication, Role-based Access Control (RBAC),
    Polyglot Python gRPC Inventory Microservice, and Standardized Error Responses.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Docker Nginx Local Server
  - url: http://localhost:8000/api/v1
    description: Artisan Serve Local Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully."
        data:
          nullable: true
        errors:
          nullable: true
          example: null

    StandardErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Human-readable error description"
        data:
          nullable: true
          example: null
        errors:
          nullable: true
          example: null

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation error."
        data:
          nullable: true
          example: null
        errors:
          type: object
          example:
            stock:
              - "Insufficient stock for product 1"

paths:
  /auth/register:
    post:
      summary: Register a new customer user
      description: |
        Registers a new customer account with standard privileges and returns an authenticated JWT.
        Client cannot select a role; roles are enforced server-side.
      tags: [Users & Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "Jane Customer"
                email:
                  type: string
                  example: "jane@example.com"
                password:
                  type: string
                  example: "secret123"
      responses:
        '201':
          description: User registered successfully with JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/login:
    post:
      summary: Login and obtain JWT token
      tags: [Users & Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "cc@gmail.com"
                password:
                  type: string
                  example: "0000"
      responses:
        '200':
          description: JWT token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Rate limit exceeded (Max 5 attempts / minute)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/me:
    get:
      summary: Get current authenticated user profile
      tags: [Users & Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/logout:
    post:
      summary: Invalidate current JWT token
      tags: [Users & Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /products:
    get:
      summary: List products with pagination and category filtering
      tags: [Products]
      parameters:
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter by primary category ID
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

    post:
      summary: Add a new product (Admin or Seller only)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price, category_id, image]
              properties:
                name:
                  type: string
                namear:
                  type: string
                price:
                  type: number
                category_id:
                  type: integer
                second_category_id:
                  type: integer
                description:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Requires admin or seller role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /products/{id}:
    get:
      summary: Get product details with live inventory stock
      description: |
        Retrieves product details and queries the live Python gRPC inventory microservice for real-time available stock.
        Returns 503 if the inventory microservice is temporarily unavailable.
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details with live stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Inventory microservice temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /orders:
    get:
      summary: List orders (Customer sees their own; Admin sees all)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

    post:
      summary: Place a new order with atomic gRPC stock reservation
      description: |
        Creates an order by reserving inventory via gRPC, saving the order transactionally in MySQL,
        and confirming the reservation in PostgreSQL. Returns 422 if stock is insufficient.
        Returns 503 if the inventory microservice is down.
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Optional idempotency key to prevent duplicate orders and ensure safe retries.
          schema:
            type: string
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, address, phone, items]
              properties:
                name:
                  type: string
                email:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error or insufficient inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '503':
          description: Inventory microservice temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /orders/{id}:
    get:
      summary: Get order details (Customer can ONLY view their own order)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Customer cannot view another customer's order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /orders/{id}/status:
    patch:
      summary: Change order status (ADMIN ONLY)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [0, 1, 2, 3, pending, processing, completed, cancelled]
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Non-admin user cannot change order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /notifications:
    get:
      summary: Get user notifications
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
