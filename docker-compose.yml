services:
  # 1. Main Database (MySQL 8 Primary for Laravel Application Writes)
  db_main:
    image: mysql:8.0
    container_name: beershop_db_main
    restart: unless-stopped
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-do-db=aboodm4_beershop
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aboodm4_beershop}
      MYSQL_USER: ${DB_USERNAME:-beershop_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-beershop_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_main_data:/var/lib/mysql
    networks:
      - beershop_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 2. Read Replica Database (MySQL 8 Read-Only Replica for Scaling Catalog & Order Reads)
  db_replica:
    image: mysql:8.0
    container_name: beershop_db_replica
    restart: unless-stopped
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=mysql-relay-bin
      - --binlog-format=ROW
      - --replicate-do-db=aboodm4_beershop
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aboodm4_beershop}
      MYSQL_USER: ${DB_USERNAME:-beershop_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-beershop_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_replica_data:/var/lib/mysql
    networks:
      - beershop_net
    depends_on:
      db_main:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 3. MySQL Replica Bootstrap (One-Shot Service: provisions replication and verifies health)
  replica_bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beershop_replica_bootstrap
    restart: "no"
    working_dir: /var/www
    command: php artisan replica:bootstrap --timeout=120
    environment:
      DB_HOST: db_main
      DB_READ_HOST: db_main
      DB_REPLICA_HOST: db_replica
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-aboodm4_beershop}
      DB_USERNAME: ${DB_USERNAME:-beershop_user}
      DB_PASSWORD: ${DB_PASSWORD:-beershop_password}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-repl_user}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-repl_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
    volumes:
      - ./:/var/www
    networks:
      - beershop_net
    depends_on:
      db_main:
        condition: service_healthy
      db_replica:
        condition: service_healthy

  # 4. Redis In-Memory Cache Store (Server-Side High Performance Caching)
  redis:
    image: redis:7-alpine
    container_name: beershop_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - beershop_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 4. Inventory Database (PostgreSQL for Polyglot Inventory Microservice)
  db_inventory:
    image: postgres:16-alpine
    container_name: beershop_db_inventory
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory_user}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_inventory_data:/var/lib/postgresql/data
    networks:
      - beershop_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory_user} -d ${INVENTORY_DB_NAME:-inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 5. Main Application (Laravel PHP-FPM with Read/Write Database Connections & Redis Caching)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beershop_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_HOST: db_main
      DB_READ_HOST: db_replica
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-aboodm4_beershop}
      DB_USERNAME: ${DB_USERNAME:-beershop_user}
      DB_PASSWORD: ${DB_PASSWORD:-beershop_password}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      INVENTORY_GRPC_HOST: inventory_service
      INVENTORY_GRPC_PORT: 50051
    volumes:
      - ./:/var/www
    networks:
      - beershop_net
    depends_on:
      db_main:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      replica_bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db_inventory:
        condition: service_healthy
      inventory_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo \"ok\";'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  # 6. Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: beershop_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - beershop_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 7. Polyglot Inventory Microservice (Python + gRPC + PostgreSQL)
  inventory_service:
    build:
      context: ./inventory_service
      dockerfile: Dockerfile
    container_name: beershop_inventory_service
    restart: unless-stopped
    environment:
      DB_HOST: db_inventory
      DB_PORT: 5432
      DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      DB_USER: ${INVENTORY_DB_USER:-inventory_user}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_password}
      GRPC_PORT: 50051
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-true}
    volumes:
      - ./inventory_service:/app
    ports:
      - "127.0.0.1:50051:50051"
    networks:
      - beershop_net
    depends_on:
      db_inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"127.0.0.1\", 50051)); s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 8. Inventory Saga Reconciliation Worker (Background Daemon)
  reconciliation_worker:
    image: beershop-app:latest
    container_name: beershop_reconciliation_worker
    restart: unless-stopped
    command: php artisan inventory:reconcile --daemon --interval=5
    working_dir: /var/www
    environment:
      DB_HOST: db_main
      DB_READ_HOST: db_replica
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-aboodm4_beershop}
      DB_USERNAME: ${DB_USERNAME:-beershop_user}
      DB_PASSWORD: ${DB_PASSWORD:-beershop_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      INVENTORY_GRPC_HOST: inventory_service
      INVENTORY_GRPC_PORT: 50051
    volumes:
      - ./:/var/www
    networks:
      - beershop_net
    depends_on:
      app:
        condition: service_healthy
      db_main:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory_service:
        condition: service_healthy

networks:
  beershop_net:
    driver: bridge

volumes:
  db_main_data:
  db_replica_data:
  db_inventory_data:
  redis_data:
